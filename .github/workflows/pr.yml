name: PR Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  linux-tests:
    name: Linux
    runs-on: ubuntu-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-tests
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Run tests
        run: |
          set -o pipefail && swift test
    
  ios-build:
    name: iOS Build
    runs-on: macos-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-ios-build
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # swift build cannot target iOS; build the package with xcodebuild as a compile guarantee.
      - name: Build - iOS
        run: |
          set -o pipefail && xcodebuild -scheme "PhoneNumberKit" -destination "generic/platform=iOS" build

  macos-tests:
    name: macOS
    runs-on: macos-latest

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-macos-tests
      cancel-in-progress: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -o pipefail && swift test