name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      commit_hash:
        description: 'Commit hash to check for metadata changes'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if metadata version changed
        id: check_metadata
        run: |
          # Determine which commit to check
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            commit_hash="${{ inputs.commit_hash }}"
            echo "Manual trigger: checking commit $commit_hash"
            compare_with="${commit_hash}^"
            compare_to="${commit_hash}"
          else
            echo "Push trigger: checking HEAD"
            compare_with="HEAD^"
            compare_to="HEAD"
          fi

          # Check if .metadata-version was modified
          if git diff $compare_with $compare_to --name-only | grep -q "Sources/PhoneNumberKit/Resources/.metadata-version"; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No metadata version change detected, skipping release"
          fi

      - name: Compute next version from latest tag
        if: steps.check_metadata.outputs.changed == 'true'
        id: bump_version
        run: |
          # Source of truth for the package version is the latest semver git tag.
          latest_tag=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          if [ -z "$latest_tag" ]; then
            echo "Error: no semver tag found to bump from (expected an initial tag like 5.0.0)"
            exit 1
          fi
          echo "Latest tag: $latest_tag"

          major=$(echo $latest_tag | cut -d. -f1)
          minor=$(echo $latest_tag | cut -d. -f2)
          patch=$(echo $latest_tag | cut -d. -f3)

          # Metadata updates are patch releases
          new_version="${major}.${minor}.$((patch + 1))"
          echo "New version: $new_version"
          echo "version=$new_version" >> $GITHUB_OUTPUT

      - name: Create and push tag
        if: steps.check_metadata.outputs.changed == 'true'
        run: |
          new_version="${{ steps.bump_version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$new_version" -m "Release $new_version"
          git push origin "$new_version"

      - name: Create GitHub release
        if: steps.check_metadata.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new_version="${{ steps.bump_version.outputs.version }}"
          gh release create "$new_version" \
            --verify-tag \
            --generate-notes
